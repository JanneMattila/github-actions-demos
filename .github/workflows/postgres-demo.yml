name: PostgreSQL Docker Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0

      - name: Build image
        run: |
          docker build -t postgres-demo .

      - name: Run tests
        run: |
          docker run --rm \
            -e POSTGRES_USER=demo \
            -e POSTGRES_PASSWORD=demo123 \
            -e POSTGRES_DB=demodb \
            -e DB_HOST=127.0.0.1 \
            -e DB_USER=demo \
            -e DB_PASSWORD=demo123 \
            -e DB_NAME=demodb \
            postgres-demo
