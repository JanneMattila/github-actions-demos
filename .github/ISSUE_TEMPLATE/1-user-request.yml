name: User request
description: Request a new user to be added to the system
title: "[User Request]: <username>"
labels:
  - github-actions
  - user-request
assignees:
  - platform-team

body:
  - type: markdown
    attributes:
      value: |
        Request to add a new user to the system.

  - type: input
    id: username
    attributes:
      label: Username
      description: GitHub username of the new user.
      placeholder: johndoe
    validations:
      required: true

  - type: dropdown
    id: membership_type
    attributes:
      label: Membership Type
      options:
        - User
        - Developer
    validations:
      required: true

  - type: textarea
    id: groups
    attributes:
      label: Group memberships
      description: |
        List the groups the user should be a member of.

        Use the following format:
        ```
        Group01
        Group02
        Group03
        ```

    validations:
      required: true
